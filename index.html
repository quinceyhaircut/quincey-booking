<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>昆希剪髮線上預約</title>
<style>
:root{--p:#6b5b99;--p2:#efeaf7;--ink:#3b3446;--muted:#8a8296;--line:#e3dded;--bg:#faf8fc;--ok:#2e8b57;--warn:#b5651d}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
header{background:var(--p);color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:20px;letter-spacing:1px}
header p{margin:2px 0 0;font-size:13px;opacity:.85}
main{padding:12px 16px 120px;max-width:560px;margin:0 auto}
h2{font-size:16px;margin:22px 0 10px;color:var(--p)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.pkg{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.pkg.sel,.svc.sel{border-color:var(--p);box-shadow:0 0 0 2px var(--p2)}
.pkg b{font-size:15px}.pkg small,.svc small{color:var(--muted);display:block;font-size:13px}
.price{color:var(--p);font-weight:600;white-space:nowrap}
.cat{font-size:13px;color:var(--muted);margin:14px 0 6px}
.svc{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.svc input{margin-top:4px;accent-color:var(--p);width:18px;height:18px}
.svc .t{flex:1}
.tag{display:inline-block;font-size:11px;background:#fff3e6;color:var(--warn);border-radius:6px;padding:0 6px;margin-left:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;text-align:center;min-width:62px;cursor:pointer}
.chip small{display:block;font-size:12px;color:var(--muted)}
.chip.sel{background:var(--p);color:#fff;border-color:var(--p)}.chip.sel small{color:#fff}
.chip.off{background:#eee;color:#aaa;border-color:#e3e3e3;text-decoration:line-through}.chip.off small{color:#bbb}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 0;text-align:center;cursor:pointer}
.slot.sel{background:var(--p);color:#fff;border-color:var(--p)}
label{display:block;font-size:14px;margin:10px 0 4px}
input[type=text],input[type=tel],input[type=date],select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:#fff;color:var(--ink)}
.seg{display:flex;gap:8px}.seg button{flex:1}
.btn{border:1px solid var(--p);background:#fff;color:var(--p);border-radius:10px;padding:10px;font-size:15px;cursor:pointer}
.btn.on,.btn.primary{background:var(--p);color:#fff}
.btn:disabled{opacity:.45}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center}
.bar .sum{flex:1;font-size:14px}.bar .sum b{font-size:17px;color:var(--p)}
.bar .btn{padding:12px 20px}
.note{font-size:13px;color:var(--warn);margin:6px 0}
.muted{color:var(--muted);font-size:14px}
.err{background:#fdecec;color:#a33;border-radius:8px;padding:10px;margin:10px 0;font-size:14px}
.done{text-align:center;padding:30px 10px}.done .big{font-size:44px}
.hide{display:none}
.mine .row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.mine .row:first-of-type{border-top:0}
.mine .row small{display:block;color:var(--muted);font-size:12px}
.modal{position:fixed;inset:0;background:rgba(40,30,60,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.modal .box{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.modal .box .btn{width:100%;margin-top:8px}
.banner{background:var(--p2);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.switch{display:flex;align-items:center;gap:8px;background:#fff7ec;border:1px solid #f1d8b8;border-radius:10px;padding:10px 12px;margin-top:10px}
.switch input{width:18px;height:18px;accent-color:var(--p)}
.grp{padding:0;overflow:hidden}
.grp .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer}
.grp .hd b{font-size:15px}.grp .hd small{display:block;color:var(--p);font-size:13px}
.grp .hd .arw{color:var(--muted);font-size:13px;white-space:nowrap}
.grp.has{border-color:var(--p)}
.grp .opts{border-top:1px solid var(--line);padding:6px 10px 10px;background:#fcfbfe}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 6px;border-bottom:1px dashed var(--line);cursor:pointer}
.opt:last-child{border-bottom:0}
.opt .dot{width:18px;height:18px;border:2px solid var(--line);border-radius:50%;flex:0 0 auto;margin-top:3px}
.opt.sel .dot{border-color:var(--p);background:radial-gradient(var(--p) 45%,#fff 50%)}
.opt .t{flex:1}.opt small{color:var(--muted);display:block;font-size:13px}
header{display:flex;align-items:center;gap:12px}
header .logo{width:58px;height:58px;border-radius:50%;background:#fff;padding:3px;flex:0 0 auto;object-fit:contain}
.hot{margin-right:2px}
.cf{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}.cf td{padding:6px 0;border-bottom:1px dashed var(--line);vertical-align:top}.cf td:first-child{color:var(--muted);width:72px;white-space:nowrap}
.warnbox{background:#fdecec;border:1px solid #f3b9b9;color:#a33;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.warnbox label{display:flex;gap:8px;align-items:center;margin:8px 0 0;color:#a33;font-weight:600}.warnbox input{width:18px;height:18px;accent-color:#a33}
</style>
</head>

<main id="app"><p class="muted">載入中…</p></main>
<div class="bar hide" id="bar"><div class="in"><div class="sum" id="sum"></div><button class="btn primary" id="next">下一步</button></div></div>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID = '2012366833-i1UEQInD';
const API = 'https://script.google.com/macros/s/AKfycbx3MClXu-KSg9ygjtWzXZTYG23vYzqhtm-cEZQHYl2usahTFYYLM9HDfZ24pyqLkWYIjQ/exec';
let C = null, idToken = '', state = { codes: [], addons: [], date: '', time: '', quote: null, step: 'pick', notes: [], resched: null, proxy: false, people: 1, note: '', open: [] };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

var _mineP = null, _mineAt = 0;
function mineData() {
  if (!_mineP || Date.now() - _mineAt > 20000) { _mineAt = Date.now(); _mineP = api('mine').catch(e => { _mineP = null; throw e; }); }
  return _mineP;
}
async function api(action, data) {
  const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, idToken }, data || {})) });
  const o = await res.json();
  if (!o.ok) {
    if (/剛被預約/.test(o.error || '') && C && C.avail) C.avail.got = 0;   // 空檔過期，下次重抓
    throw new Error(o.error || '發生錯誤');
  }
  if (['book', 'cancel', 'reschedule', 'bind'].includes(action)) { _mineP = null; if (C && C.avail) C.avail.got = 0; }
  return o;
}

/* 空檔：打開頁面時一次載入 20 天，點日期／改服務都在手機上直接算 */
function setAvail(a) { if (C) C.avail = a ? Object.assign(a, { got: Date.now() }) : null; }
function availFresh() { return C.avail && C.avail.days && Date.now() - C.avail.got < 180000; }
const tmin = s => { const [a, b] = String(s).split(':').map(Number); return a * 60 + (b || 0); };
function localSlots(date, minutes, skipLunch, excl) {
  const A = C.avail, d0 = A.days[date];
  if (!d0 || d0.closed) return { closed: true, slots: [] };
  const d = { busy: excl && excl.date === date ? d0.busy.filter(x => !(x[0] === tmin(excl.time) - A.buf && x[1] === tmin(excl.end) + A.buf)) : d0.busy };
  const ov = (a, b, l) => l.some(x => a < x[1] && b > x[0]);
  const lunchOk = l => { for (let x = A.ls; x + A.len <= A.le; x += A.unit) if (!ov(x, x + A.len, l)) return true; return false; };
  const nowM = A.nowMin + Math.floor((Date.now() - A.got) / 60000);
  const prot = A.prot || [], nd = A.protDays == null ? 3 : A.protDays, hot = d0.hot || [];
  const dd = Math.round((Date.parse(date) - Date.parse(A.today)) / 864e5);
  const protOk = (t, e) => prot.every(w => !(t < w[1] && e > w[0]) || dd <= nd || hot.some(h => h[0] < w[1] + 30 && h[1] > w[0] - 30));   // 保留時段（與後端相同）
  const lf = lunchOk(d.busy), out = [];
  for (let t = A.open; t <= A.latest; t += (A.step || A.unit)) {
    const e = t + minutes;
    if (e > A.close) continue;
    if (date === A.today && t < nowM + A.lead) continue;
    if (ov(t - A.buf, e + A.buf, d.busy)) continue;
    if (!skipLunch && !protOk(t, e)) continue;
    if (!skipLunch && lf && !lunchOk(d.busy.concat([[t, e]]))) continue;
    out.push(String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'));
  }
  return { closed: false, slots: out };
}
function promoUsed() {
  if (!promo(state.date)) return false;
  return state.codes.concat(state.addons).some(c => {
    const l = C.prices.filter(x => x.code === c && x.since <= state.date);
    return l.length && rowsAt(c, state.date)[0] && rowsAt(c, state.date)[0].since !== l.map(x => x.since).sort().pop();
  });
}
function showErr(e) { const d = document.createElement('div'); d.className = 'err'; d.textContent = e.message || e; $('#app').prepend(d); window.scrollTo(0, 0); }

/* 價格（顯示用，正式金額以後端為準） */
function nowStr() { const d = new Date(Date.now() + 8 * 3600e3); return d.toISOString().slice(0, 16).replace('T', ' '); }
function promo(date) {
  const r = (C.promo.range || '').split('~');
  return C.promo.end && nowStr() <= C.promo.end && r.length > 1 && date >= r[0].trim() && date <= r[1].trim();
}
function hairNow() { return (state.form && state.form.hair) || (C.customer && C.customer.hair) || ''; }
function rowsAt(code, date) {
  const d = date || C.today;
  const eff = promo(d) ? C.today : d;
  const list = C.prices.filter(x => x.code === code && x.since <= eff);
  if (!list.length) return [];
  const since = list.map(x => x.since).sort().pop();
  return list.filter(x => x.since === since);
}
function priceOf(code, date, hair) {
  const c = rowsAt(code, date);
  if (!c.length) return { price: 0, from: false };
  const h = c.filter(x => x.hair);
  if (!h.length) return c[0];
  const m = (hair === undefined ? hairNow() : hair) ? h.find(x => x.hair === (hair === undefined ? hairNow() : hair)) : null;
  return m || { price: Math.min(...h.map(x => x.price)), from: true };
}
const HAIR_TXT = { '短': '短（肩上）', '中': '中（胸上）', '長': '長（過胸）' };
function hairNote(code, date) {
  const h = rowsAt(code, date).filter(x => x.hair);
  return h.length ? '依髮長：' + h.map(x => HAIR_TXT[x.hair] + ' ' + x.price).join('／') : '';
}
function needHair() { return state.codes.some(c => rowsAt(c, state.date).some(x => x.hair)); }
/* 髮長加時：中、長髮多留時間；染髮短中長本身已分時長、到府剪髮另計，不加 */
function hairApplies(codes) { codes = codes || state.codes; return codes.length > 0 && !codes.some(c => /^(DYE_[SML]|HOME)$/.test(c)) && !codes.every(c => c === 'BANG'); }
function hairExtra(hair, codes) { if (!hairApplies(codes)) return 0; const s = C.settings || {}; return hair === '長' ? (s.hairLong || 0) : hair === '中' ? (s.hairMid || 0) : 0; }
function askHair() { return !state.resched && (needHair() || hairApplies()); }
const svc = c => C.services.find(s => s.code === c);
const add = c => C.addons.find(a => a.code === c);
function fmt(p) { return '$' + p.price.toLocaleString() + (p.from ? ' 起' : ''); }

/* 組合規則（與後端相同） */
function normalize() {
  let c = [...new Set(state.codes)]; const notes = [];
  const W = ['WCB', 'WCB_NR'];
  if (c.some(x => x.startsWith('TR_')) && c.some(x => W.includes(x) || x === 'CUT_RINSE')) {
    c = c.filter(x => !W.includes(x) && x !== 'CUT_RINSE'); if (!c.includes('CUT')) c.unshift('CUT'); notes.push('護髮已含洗髮及吹整，已幫你改成剪髮＋護髮');
  }
  if (c.filter(x => W.includes(x)).length > 1) { const last = c.filter(x => W.includes(x)).pop(); c = c.filter(x => !W.includes(x) || x === last); notes.push('剪洗吹整只能選一種'); }
  if (c.some(x => x.startsWith('PERM')) && c.some(x => ['CUT', 'CUT_RINSE'].concat(W).includes(x))) { c = c.filter(x => !['CUT', 'CUT_RINSE'].concat(W).includes(x)); notes.push('燙髮已含剪髮'); }
  const hw = c.some(x => W.includes(x)), ht = c.some(x => x.startsWith('TR_'));   // 護髮可加購升級洗髮（一般洗髮護髮本來就含）
  if ((hw && c.some(x => x.startsWith('WASH_'))) || (ht && c.includes('WASH_N'))) { c = c.filter(x => hw ? !x.startsWith('WASH_') : x !== 'WASH_N'); notes.push(hw ? '此項目已含洗髮' : '護髮已含一般洗髮'); }
  const allowed = new Set(); c.forEach(x => (svc(x) || { addons: [] }).addons.forEach(a => allowed.add(a)));
  state.codes = c; state.addons = state.addons.filter(a => allowed.has(a)); state.notes = notes;
  return allowed;
}
const same = (a, b) => JSON.stringify([...a].sort()) === JSON.stringify([...b].sort());
function addPrice(a, date) { const r = rowsAt(a, date); return r.length ? r[0].price : add(a).price; }
/* 組合價：套餐有「組合價代碼」且價目表有價格（>0）時，取代單項相加 */
function pkgOver(codes, addons, date) {
  const p = C.packages.find(p => p.key && same(p.codes, codes) && p.addons.every(a => addons.includes(a)));
  if (!p) return null;
  const r = rowsAt(p.key, date);
  if (!r.length || !r[0].price) return null;
  return { p, price: r[0].price, from: r[0].from };
}
function pkgPrice(p) {
  const o = pkgOver(p.codes, p.addons, '');
  if (o) return o;
  return { price: p.codes.reduce((s, c) => s + priceOf(c).price, 0) + p.addons.reduce((s, a) => s + addPrice(a), 0), from: p.codes.some(c => priceOf(c).from) };
}
function total() {
  let t = 0, m = 0, from = false;
  state.codes.forEach(c => { const p = priceOf(c, state.date); t += p.price; from = from || p.from; m += svc(c).min; });
  let at = 0;
  state.addons.forEach(a => { at += addPrice(a, state.date); m += add(a).min; });
  const pk = pkgOver(state.codes, state.addons, state.date);
  if (pk) { t = pk.price; from = pk.from; at = state.addons.filter(a => !pk.p.addons.includes(a)).reduce((s, a) => s + addPrice(a, state.date), 0); }
  m += hairExtra(hairNow(), state.codes);
  const n = state.people || 1;
  return { t: (t + at) * n, m: Math.ceil(m * n / 10) * 10, from };
}

/* 畫面：選服務 */
const SHORT = { BANG: '修瀏海', CUT: '單剪髮', CUT_RINSE: '剪髮＋沖洗一次＆自助式吹乾', KID_CUT: '單剪髮', KID_RINSE: '剪髮＋沖洗一次＆自助式吹乾', KID_WCB: '剪洗吹整' };
const SUBS = ['剪＋洗兩次＋吹整', '剪＋洗二次＋吹整', '含洗髮及吹整'];
function splitName(n) { const m = String(n || '').match(/^(.*?)（([^（）]+)）$/); return m && SUBS.includes(m[2]) ? [m[1], m[2].replace('兩次', '二次')] : [String(n || ''), '']; }
const nm = s => splitName(s.name)[0];
const subHtml = s => splitName(s.name)[1] ? '<br>' + esc(splitName(s.name)[1]) : '';
const label = s => SHORT[s.code] || nm(s);
const ADD_ICON = { BROW: '🔥', QTR: '👑', EXFO: '⭐' };   // 熱門加購圖示
function cats() {
  const out = [];
  C.services.filter(s => !s.hidden).forEach(s => { let g = out.find(x => x.cat === s.cat); if (!g) out.push(g = { cat: s.cat, list: [] }); g.list.push(s); });
  return out;
}
/* 重複防呆：回傳提醒文字，沒重複就回傳空字串 */
const CUT_RE = /^(CUT|CUT_RINSE|BANG|WCB|WCB_NR|KID_CUT|KID_RINSE|KID_WCB|HOME|PERM.*)$/;
const WASHIN_RE = /^(TR_.*|WCB|WCB_NR|KID_WCB)$/;
function conflict(codes, addons) {
  const cuts = codes.filter(c => CUT_RE.test(c)).map(c => label(svc(c)));
  if (addons.includes('CUT_ADD')) cuts.push('加購剪髮');
  if (addons.includes('BANG_ADD') && !codes.some(c => c.startsWith('PERM'))) cuts.push('加購修瀏海');
  if (cuts.length > 1) return '「' + cuts[0] + '」和「' + cuts[1] + '」重複了，剪髮、修瀏海只能選一項。';
  const wi = codes.find(c => WASHIN_RE.test(c)), w = codes.find(c => c.startsWith('WASH_'));
  if (wi && w && !(wi.startsWith('TR_') && w !== 'WASH_N')) return '「' + label(svc(wi)) + '」已含洗髮，不需要再選「' + label(svc(w)) + '」。';
  const ri = codes.find(c => /^(CUT_RINSE|KID_RINSE)$/.test(c));
  if (ri && w) return '「' + label(svc(ri)) + '」已含沖洗，要洗頭請改選「剪洗吹整」。';
  const tr = codes.find(c => c.startsWith('TR_'));
  if (tr && addons.includes('QTR')) return '已選「' + label(svc(tr)) + '」，不需要再加購瞬間護髮。';
  return '';
}

  const v = k => esc(f[k] != null ? f[k] : (c[k] || ''));
  const hair = f.hair != null ? f.hair : (c.hair || '');
  let h = '<button class="btn" id="back">← 改時間</button><h2>填寫資料</h2>';
  if (C.isOwner) h += '<label class="switch"><input type="checkbox" id="proxy"' + (px ? ' checked' : '') + '><span><b>代客預約（電話）</b><br><small class="muted">幫打電話來的客人預約；客人用 LINE 預約過的話，系統會用 LINE 通知他</small></span></label>';
  h += '<div class="card">';
  h += '<label>' + (px ? '客人姓名' : '姓名（幫家人預約請填被服務者）') + '</label><input type="text" id="name" value="' + v('name') + '">';
  h += '<label>' + (px ? '客人手機' : '手機') + '</label><input type="tel" id="phone" placeholder="09xxxxxxxx" value="' + v('phone') + '">';
  h += '<label>生日（年/月/日，選填）</label><input type="date" id="birthday" min="1920-01-01" max="' + C.today + '" value="' + esc(toISODate(f.birthday != null ? f.birthday : (c.birthday || ''))) + '">';
  if (state.codes.includes('DYE_SP')) h += '<label>髮長（必填，特殊染髮報價用）</label><select id="hair"><option value="">請選擇</option>' + ['短', '中', '長'].map(x => '<option value="' + x + '"' + (hair === x ? ' selected' : '') + '>' + HAIR_TXT[x] + '</option>').join('') + '</select>';
  if (px || !c.returning) h += '<label>是否來過昆希剪髮？</label><div class="seg"><button class="btn' + (f.isNew === false ? ' on' : '') + '" data-new="0">來過</button><button class="btn' + (f.isNew === true ? ' on' : '') + '" data-new="1">第一次</button></div>';
  if (state.codes.includes('HOME')) h += '<label>到府地址</label><input type="text" id="address" value="' + esc(f.address || '') + '">';
  h += '</div>';
  h += '<div class="card"><b>' + state.date + ' ' + state.time + '</b>' + (state.people > 1 ? '｜' + state.people + ' 位' : '') + '<br>' + state.codes.map(x => esc(nm(svc(x)))).concat(state.addons.map(a => '加購' + esc(add(a).name))).join('、') + (state.note ? '<br><small class="muted">備註：' + esc(state.note) + '</small>' : '') + '</div>';
  $('#app').innerHTML = h;
  $('#back').onclick = () => { state.form = read(); state.step = 'time'; renderTime(); };
  document.querySelectorAll('[data-new]').forEach(el => el.onclick = () => { state.form = Object.assign(read(), { isNew: el.dataset.new === '1' }); renderForm(); });
  if ($('#hair')) $('#hair').onchange = () => { state.form = read(); bar(true, px ? '確認代客預約' : '確認預約', submit); };
  if ($('#proxy')) $('#proxy').onchange = () => { state.proxy = $('#proxy').checked; state.form = { hair: '' }; renderForm(); };
  bar(true, px ? '確認代客預約' : '確認預約', submit);
}
function read() {
  const g = id => ($('#' + id) || {}).value;
  return Object.assign({}, state.form, { name: g('name'), phone: (g('phone') || '').replace(/\D/g, ''), birthday: g('birthday'), hair: $('#hair') ? g('hair') : ((state.form || {}).hair || hairNow()), address: g('address'), note: state.note });
}
/* 送出前確認視窗；服務前 N 小時內（不能線上取消／改期）加紅色提醒，要勾「我了解」才能送出 */
const WD = '日一二三四五六';
function minsUntil(date, time) { return (Date.parse(date + 'T' + time + ':00Z') - Date.parse(nowStr().replace(' ', 'T') + ':00Z')) / 60000; }
function askBox(html, ok, no, needAck) {
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = '<div class="box">' + html + '<button class="btn primary" id="m-ok"' + (needAck ? ' disabled' : '') + '>' + ok + '</button><button class="btn" id="m-no" style="border-color:var(--line);color:var(--muted)">' + no + '</button></div>';
    document.body.appendChild(m);
    const done = v => { m.remove(); res(v); };
    m.onclick = e => { if (e.target === m) done(false); };
    m.querySelector('#m-no').onclick = () => done(false);
    m.querySelector('#m-ok').onclick = () => done(true);
    const ack = m.querySelector('#m-ack');
    if (ack) ack.onchange = () => { m.querySelector('#m-ok').disabled = !ack.checked; };
  });
}
function confirmBook(resched) {
  const f = state.form || {}, t = total(), r = state.resched;
  const dw = WD[new Date(state.date + 'T00:00:00Z').getUTCDay()];
  const items = state.codes.map(x => label(svc(x))).concat(state.addons.map(a => '加購' + add(a).name));
  const row = (k, v) => v ? '<tr><td>' + k + '</td><td>' + v + '</td></tr>' : '';
  let h = '<b style="font-size:17px">' + (resched ? '請確認改期資訊' : '請確認預約資訊') + '</b><table class="cf">' +
    row('日期', esc(state.date.replace(/-/g, '/')) + '（' + dw + '）') +
    row('時間', esc(state.time) + ' 開始，約 ' + t.m + ' 分鐘') +
    (resched && r ? row('原時間', esc(r.date + ' ' + r.time)) : '') +
    row('服務', items.map(esc).join('<br>')) +
    row('人數', state.people > 1 ? state.people + ' 位' : '') +
    row('預估', '$' + t.t.toLocaleString() + (t.from ? ' 起' : '')) +
    (resched ? '' : row('姓名', esc(f.name)) + row('手機', esc(f.phone)) + row('地址', esc(f.address)) + row('備註', esc(state.note))) + '</table>';
  const hrs = (C.settings && C.settings.cancelHours) || 3;
  const warn = !state.proxy && !C.isOwner && minsUntil(state.date, state.time) < hrs * 60;
  if (warn) h += '<div class="warnbox">⚠️ 這個時段距離現在不到 ' + hrs + ' 小時，送出後<b>無法線上取消或改期</b>。如需異動，請直接傳 LINE 訊息給店家。<label><input type="checkbox" id="m-ack">我了解，仍要' + (resched ? '改期' : '預約') + '</label></div>';
  return askBox(h, resched ? '確認改期' : '確認送出', '返回修改', warn);
}
async function submit() {
  state.form = read();
  const label = $('#next').textContent;
  if (askHair() && !state.form.hair) { showErr('請回上一步選擇髮長'); return; }
  if (state.codes.includes('DYE_SP') && !state.form.hair) { showErr('特殊染髮請選擇髮長'); return; }
  if (!state.proxy && !C.customer.returning && state.form.isNew == null) { showErr('請選擇是否來過昆希剪髮'); return; }
  if (!(await confirmBook(false))) return;
  $('#next').disabled = true; $('#next').textContent = '送出中…';
  try {
    const o = await api('book', { date: state.date, time: state.time, codes: state.codes, addons: state.addons, form: state.form, proxy: state.proxy, people: state.people });
    if (!state.proxy) { try { if (liff.isInClient()) await liff.sendMessages([{ type: 'text', text: '預約完成 #' + o.booking.id }]); } catch (e) {} }
    renderDone(o.booking);
  } catch (e) { showErr(e); $('#next').disabled = false; $('#next').textContent = label; }
}
async function doResched() {
  if (!(await confirmBook(true))) return;
  $('#next').disabled = true; $('#next').textContent = '改期中…';
  try {
    const r = state.resched;
    const o = await api('reschedule', { id: r.id, date: state.date, time: state.time });
    if (!r.proxy && !C.isOwner) { try { if (liff.isInClient()) await liff.sendMessages([{ type: 'text', text: '預約改期 #' + o.booking.id }]); } catch (e) {} }
    renderDone(o.booking);
  } catch (e) { showErr(e); $('#next').disabled = false; $('#next').textContent = '確認改期'; }
}

/* 畫面：完成 */
function renderDone(b) {
  $('#bar').classList.add('hide');
  const pending = b.status === '待確認';
  const title = b.rescheduled ? '改期成功' : b.proxy ? '已代客預約' : (pending ? '已送出，待店家確認' : '預約成功');
  state.resched = null; state.proxy = false; state.people = 1; state.note = '';
  const gcal = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent('昆希剪髮預約') +
    '&dates=' + b.date.replace(/-/g, '') + 'T' + b.time.replace(':', '') + '00/' + b.date.replace(/-/g, '') + 'T' + b.end.replace(':', '') + '00&ctz=Asia/Taipei&details=' + encodeURIComponent(b.items.join('、') + '\n編號 ' + b.id);
  $('#app').innerHTML = '<div class="done"><div class="big">' + (pending ? '⏳' : '✅') + '</div><h2>' + title + '</h2>' +
    '<p><b>' + b.date + ' ' + b.time + '–' + b.end + '</b>' + (b.people > 1 ? '｜' + b.people + ' 位' : '') + '</p><p>' + b.items.map(esc).join('<br>') + '</p><p class="price">預估 $' + b.total.toLocaleString() + (b.from ? ' 起' : '') + '</p>' +
    (b.promo ? '<p class="note">🎁 已享 11/30 前預約原價優惠</p>' : '') +
    (b.byOwner ? (b.notified ? '<p class="muted">已用 LINE 通知客人新時間</p>' : '<p class="muted">這位客人沒有綁定 LINE，請自行聯絡</p>') : b.proxy ? (b.notified ? '<p class="muted">已寫入日曆，並用 LINE 通知客人</p>' : '<p class="muted">已寫入日曆。這位客人沒有綁定 LINE，請自行聯絡</p>') : pending ? '<p class="muted">店家確認後會用 LINE 通知你</p>' : '<p class="muted">確認訊息已傳到聊天室</p>') +
    (b.proxy && b.bindUrl ? '<div class="card" style="text-align:left"><b>傳綁定連結給客人</b><p class="muted">客人點開後，這筆預約和之後的提醒都會傳到他的 LINE。連結由你傳送，不會用到官方帳號訊息數。</p><button class="btn" id="bshare">用 LINE 傳給客人</button> <button class="btn" id="bcopy">複製連結</button></div>' : '') +
    (b.proxy ? '' : '<p><button class="btn" id="cal">加入手機行事曆</button></p>') + '<p><button class="btn primary" id="close">完成</button></p></div>';
  const bmsg = b.bindUrl ? '昆希剪髮已幫你預約 ' + b.date + ' ' + b.time + '，點這個連結就能在 LINE 收到預約提醒、自己查看或改期：\n' + b.bindUrl : '';
  if ($('#bshare')) $('#bshare').onclick = () => liff.openWindow({ url: 'https://line.me/R/share?text=' + encodeURIComponent(bmsg), external: false });
  if ($('#bcopy')) $('#bcopy').onclick = async () => { try { await navigator.clipboard.writeText(bmsg); $('#bcopy').textContent = '已複製 ✓'; } catch (e) { prompt('複製這段文字', bmsg); } };
  if ($('#cal')) $('#cal').onclick = () => liff.openWindow({ url: gcal, external: true });
  $('#close').onclick = () => liff.isInClient() ? liff.closeWindow() : location.reload();
  if (!b.proxy && !b.byOwner) remind(b);
}
function remind(b) {
  const hrs = C.settings.cancelHours;
  const within = (new Date(b.date + 'T' + b.time + ':00+08:00').getTime() - Date.now()) / 36e5 < hrs;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="box"><b>📌 提醒</b><p>服務前 ' + hrs + ' 小時內無法線上取消或改期，如需更改請直接傳 LINE 訊息給店家。</p>' +
    (within ? '<p class="note">這筆預約距離服務已不到 ' + hrs + ' 小時，之後無法線上取消或改期。</p>' : '') +
    '<button class="btn primary" id="m-ok">知道了</button></div>';
  document.body.appendChild(m);
  $('#m-ok').onclick = () => m.remove();
}

function renderCancelled(b) {
  $('#bar').classList.add('hide');
  $('#app').innerHTML = '<div class="done"><div class="big">❌</div><h2>已取消預約</h2>' +
    '<p><b>' + esc(b.date + ' ' + b.time + '–' + b.end) + '</b></p><p>' + (C.isOwner && !b.self ? esc(b.name) + '｜' : '') + esc(b.items) + '</p><p class="muted">編號 ' + esc(b.id) + '</p>' +
    (C.isOwner && !b.self ? (b.notified ? '<p class="muted">已用 LINE 通知客人</p>' : '<p class="muted">這位客人沒有綁定 LINE，請自行聯絡</p>') : '<p class="muted">取消資訊已傳到聊天室，期待下次為你服務 🙏</p>') +
    '<p><button class="btn primary" id="again">重新預約</button></p></div>';
  $('#again').onclick = () => { state.step = 'pick'; renderPick(); };
}

/* 我的預約 */
async function loadMine() {
  try {
    const o = await mineData();
    if (!o.list.length || state.step !== 'pick') return;
    const el = $('#mine'); if (!el) return;
    el.classList.remove('hide');
    el.innerHTML = '<b>' + (o.isOwner ? '預約清單（全部客人，共 ' + o.list.length + ' 筆）' : '我的預約') + '</b>' + o.list.map(r => '<div class="row"><span>' + r.date + ' ' + r.time + (r.status === '待確認' ? '<span class="tag">待確認</span>' : '') +
      '<small>' + (o.isOwner ? (r.proxy ? '☎️ ' : '') + esc(r.name) + '｜' : '') + esc(r.items) + '</small></span>' +
      (r.cancellable ? '<button class="btn" data-act="' + r.id + '">取消／改期</button>' : '<small class="muted">' + C.settings.cancelHours + ' 小時內請傳訊息</small>') + '</div>').join('');
    el.querySelectorAll('[data-act]').forEach(b => b.onclick = () => chooser(o.list.find(r => r.id === b.dataset.act)));
  } catch (e) {}
}

function chooser(r) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="box"><b>' + esc(r.date + ' ' + r.time) + '</b><br><small class="muted">' + esc(r.items) + '</small>' +
    '<button class="btn primary" id="m-re">改期（換日期／時間）</button><button class="btn" id="m-cancel">取消預約</button><button class="btn" id="m-close" style="border-color:var(--line);color:var(--muted)">返回</button></div>';
  document.body.appendChild(m);
  const close = () => m.remove();
  m.onclick = e => { if (e.target === m) close(); };
  $('#m-close').onclick = close;
  $('#m-re').onclick = () => { close(); state.resched = r; state.people = r.people || 1; state.codes = [...r.codes]; state.addons = [...r.addons]; state.date = ''; state.time = ''; state.step = 'time'; renderTime(); };
  $('#m-cancel').onclick = async () => {
    close();
    if (!(await askBox('<b>確定要取消這筆預約嗎？</b><br><small class="muted">' + esc(r.date + ' ' + r.time) + '｜' + esc(r.items) + '</small>', '確定取消', '返回'))) return;
    try {
      const o = await api('cancel', { id: r.id });
      if (o.booking.self) { try { if (liff.isInClient()) await liff.sendMessages([{ type: 'text', text: '取消預約 #' + r.id }]); } catch (e) {} }
      renderCancelled(o.booking);
    } catch (e) { showErr(e); }
  };
}

(async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    idToken = liff.getIDToken();
    mineData().catch(() => {});   // 預約清單和主資料同時抓
    // 先用上次存的服務與價目畫出畫面，背景同時抓最新資料
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem('qcfg') || 'null'); } catch (e) {}
    if (cached && cached.services) { C = Object.assign(cached, { avail: undefined }); $('#app').innerHTML = ''; renderPick(); }
    const fresh = await api('config');
    if (fresh.avail) fresh.avail.got = Date.now();
    try { const s = Object.assign({}, fresh); delete s.avail; localStorage.setItem('qcfg', JSON.stringify(s)); } catch (e) {}
    const untouched = !C || (state.step === 'pick' && !state.codes.length);
    C = fresh;
    if (untouched) renderPick();
    const bind = new URLSearchParams(location.search).get('bind');
    if (bind) {
      try { const o = await api('bind', { code: bind }); const d = document.createElement('div'); d.className = 'banner'; d.innerHTML = '✅ 已綁定你的 LINE：' + esc(o.booking.date + ' ' + o.booking.time) + ' 的預約之後會用 LINE 提醒你，也可以在「我的預約」查看'; $('#app').prepend(d); }
      catch (e) { showErr(e); }
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
    }
  } catch (e) { $('#app').innerHTML = ''; showErr(e); }
})();
</script>
</body>
